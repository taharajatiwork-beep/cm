services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cm
      POSTGRES_PASSWORD: cm
      POSTGRES_DB: cm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cm -d cm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cm
      MINIO_ROOT_PASSWORD: cmcmcmcm
    volumes:
      - minio:/data

  # One API service. Scale by running the same image again behind nginx; Compose does not start a second replica here.
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://cm:cm@postgres:5432/cm
      REDIS_URL: redis://redis:6379/0
      WORKER_MODE: external
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://cm:cm@postgres:5432/cm
      REDIS_URL: redis://redis:6379/0
      WORKER_MODE: external
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    ports:
      - "443:443"
    depends_on:
      - api
      - web

  backup:
    image: postgres:16-alpine
    environment:
      DATABASE_URL: postgresql://cm:cm@postgres:5432/cm
      BACKUP_DIR: /backups
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - cmbackups:/backups
    entrypoint: ["/bin/sh", "-c", "chmod +x /backup.sh; while true; do /backup.sh || true; sleep 86400; done"]
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - api

  loki:
    image: grafana/loki:3.2.0
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: cm
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  pgdata:
  minio:
  cmbackups:
