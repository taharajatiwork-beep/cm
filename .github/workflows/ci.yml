name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cm
          POSTGRES_PASSWORD: cm
          POSTGRES_DB: cm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cm -d cm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Ruff lint
        working-directory: backend
        run: pip install ruff && ruff check app tests scripts
      - name: Mypy (whole app)
        working-directory: backend
        run: pip install mypy && mypy app --ignore-missing-imports
      - name: Shellcheck (deploy scripts)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck && shellcheck deploy/backup.sh
      - name: Nginx config is valid
        run: |
          sudo apt-get update -qq
          docker run --rm -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
      - name: Production compose is valid (no secrets in file)
        run: |
          # فایل باید بدون هیچ متغیر محیطی هم parse شود؛ فقط ساختار مهم است.
          POSTGRES_PASSWORD=x MINIO_ROOT_USER=x MINIO_ROOT_PASSWORD=x \
          DATABASE_URL=x BACKUP_PASSPHRASE=x GF_SECURITY_ADMIN_PASSWORD=x CORS_ORIGINS=x \
            docker compose -f docker-compose.prod.yml config --quiet
      - name: Dependency audit
        working-directory: backend
        continue-on-error: true
        run: pip install pip-audit && pip-audit
      - name: Pytest
        working-directory: backend
        env:
          APP_ENV: development
          LLM_PROVIDER: rules
          POSTGRES_TEST_URL: postgresql+asyncpg://cm:cm@localhost:5432/cm_test
        run: pytest -q --tb=short
      - name: Load test on Postgres (perf budgets)
        working-directory: backend
        env:
          APP_ENV: development
          LLM_PROVIDER: rules
          DATABASE_URL: postgresql+asyncpg://cm:cm@localhost:5432/cm
          LOADTEST_DATABASE_URL: postgresql+asyncpg://cm:cm@localhost:5432/cm
        # این تنها مرحله‌ای است که اعداد کارایی به دیتابیس واقعی نزدیک‌اند.
        # بودجه‌ها روی runner شلوغ CI سخت‌گیرانه‌اند؛ اگر شکست خورد اول
        # محلی با --print-only بررسی کن که مشکل از کد است یا ماشین.
        run: python -m scripts.loadtest --users 8 --rounds 2
      - name: Alembic upgrade and schema check
        working-directory: backend
        env:
          APP_ENV: development
          DATABASE_URL: postgresql+asyncpg://cm:cm@localhost:5432/cm
          SECRET_KEY: ci-secret-not-a-placeholder-value
          TELEGRAM_MODE: "off"
          TELEGRAM_BOT_TOKEN: ""
        run: alembic upgrade head && alembic check
      - name: Audit hash chain intact
        working-directory: backend
        env:
          APP_ENV: development
          DATABASE_URL: postgresql+asyncpg://cm:cm@localhost:5432/cm
          SECRET_KEY: ci-secret-not-a-placeholder-value
          TELEGRAM_MODE: "off"
          TELEGRAM_BOT_TOKEN: ""
        # اگر کسی سطر ممیزی را مستقیم در دیتابیس تغییر دهد، این مرحله شکست می‌خورد
        run: python -m scripts.verify_audit_chain
      - name: Postgres smoke
        working-directory: backend
        env:
          POSTGRES_TEST_URL: postgresql://cm:cm@localhost:5432/cm
        run: python scripts/postgres_smoke.py

  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cm
          POSTGRES_PASSWORD: cm
          POSTGRES_DB: cm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cm -d cm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b --pretty false
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend for e2e
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium && npm run e2e
      - name: npm audit
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high
