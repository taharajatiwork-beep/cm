# nginx پیش از reverse proxy: TLS + هدرهای امنیتی
#
# هدرها عمداً در سطح `server` تعریف شده‌اند نه داخل هر `location`،
# تا در همهٔ پاسخ‌ها (API، SPA و خطاها) یکسان اعمال شوند.
# `always` لازم است تا در پاسخ‌های 4xx/5xx هم اعمال شوند.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # سقف حجم درخواست — هم‌تراز با UPLOAD_MAX_BYTES
    client_max_body_size 8m;

    # ---------- هدرهای امنیتی ----------
    # HSTS: مرورگر مجبور می‌شود همیشه از HTTPS استفاده کند
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # جلوگیری از embed شدن در iframe (clickjacking)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # نسخهٔ nginx از هدرها حذف شود
    server_tokens off;

    # CSP: برنامه فقط از خودش بارگذاری می‌کند. فونت‌ها self-host هستند
    # (نه fonts.googleapis.com) پس هیچ منبع خارجی لازم نیست.
    # 'unsafe-inline' برای style لازم است — Tailwind سبک تزریق می‌کند.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ---------- API ----------
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
    }

    # ---------- SPA ----------
    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}

# هر درخواست plain-text به HTTPS هدایت می‌شود.
server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}
