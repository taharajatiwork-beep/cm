[project]
name = "cm-backend"
version = "0.1.0"
description = "AI-native communication & operations platform — Phase 0/1 Communication Core"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",
    "python-multipart>=0.0.17",
    "structlog>=24.4.0",
    "email-validator>=2.2.0",
    "openpyxl>=3.1.5",
    "redis>=5.0.0",
    "reportlab>=4.2.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.6.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[project.scripts]
cm-api = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: imports, B: bugbear, UP: pyupgrade,
# S110: silent try/except/pass, BLE: blind except, SIM102: collapsible if.
select = ["E9", "F", "I", "B", "UP", "S110", "BLE", "SIM102"]
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI Depends()/Query()/Body() in defaults is the framework's idiom.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Path",
]

[tool.ruff.lint.per-file-ignores]
# (UP042 is ignored globally below: StrEnum changes str() semantics and the
# enum values are persisted, so the migration is not a pure refactor.)
# Long-running supervisors and external-service boundaries must survive any
# failure of a single job/update; each handler logs and continues.
"app/worker.py" = ["BLE001"]
"app/integrations/**" = ["BLE001"]
"scripts/**" = ["BLE001"]
# Importing a pytest fixture and using it as an argument is the idiom.
"tests/**" = ["F811", "BLE001", "S110"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = true
